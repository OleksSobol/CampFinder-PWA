version: '3.8'
services:
  campfinder:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
