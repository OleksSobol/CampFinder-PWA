version: '3.8'

services:
  campfinder:
    build: .
    container_name: campfinder-pwa
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persist scraped data across container rebuilds
      - ./data:/app/data
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
